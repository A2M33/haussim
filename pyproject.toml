[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haussim"
dynamic = ["version"]
description = "A small house with an air/water heat pump, run by a PLC program. No dependencies."
readme = "README.md"
license = "MIT"
authors = [{ name = "A2M33" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["plc", "heat pump", "building automation", "hvac", "simulator"]

[project.urls]
Homepage = "https://github.com/A2M33/haussim"

[project.scripts]
haussim = "haussim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "haussim.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
